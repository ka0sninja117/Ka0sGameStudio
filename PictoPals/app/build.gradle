plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ka0s.pictopals'
    compileSdk 35

    defaultConfig {
        applicationId "com.ka0s.pictopals"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        release {
            storeFile file('../keystore/pictopals.jks')
            storePassword 'pictopals'
            keyAlias 'pictopals'
            keyPassword 'pictopals'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
